services:
  workbench:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-local-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in the current environment.}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:?Set APP_SESSION_SECRET in the current environment.}
      APP_PORT: "8000"
