[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-web-security-workbench"
version = "0.1.0"
description = "A localhost-only web security self-check and remediation workbench."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
    "keyring==25.7.0",
    "python-multipart==0.0.32",
    "uvicorn[standard]==0.52.3",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]
